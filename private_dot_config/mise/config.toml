[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]

[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
go = "latest"
zig = "latest"
bun = "latest"
jq = "latest"
bat = "latest"
yq = "latest"
ripgrep = "latest"
fzf = "latest"
tinymist = "latest"
gh = { version = "latest", postinstall = "git config --global --replace-all credential.'https://github.com'.helper '!$HOME/.local/share/mise/shims/gh auth git-credential' && git config --global --replace-all credential.'https://gist.github.com'.helper '!$HOME/.local/share/mise/shims/gh auth git-credential'" }
typst = "latest"
chezmoi = "latest"
terraform = "latest"
uv = "latest"
python = "3.12"
node = "24.14.0"
just = "latest"
wrangler = "latest"
ast-grep = "latest"
fd = "latest"
grpcurl = "latest"
java = "temurin-25"
gradle = "8"
"cargo:cargo-deny" = "latest"
"cargo:cargo-hack" = "latest"

[env]
# gcloud no longer supports the system Python 3.9
CLOUDSDK_PYTHON = "{{env.HOME}}/.local/share/uv/python/cpython-3.12-macos-aarch64-none/bin/python3.12"
